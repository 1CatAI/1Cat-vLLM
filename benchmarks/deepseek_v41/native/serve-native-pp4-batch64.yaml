default-chat-template-kwargs: '{"thinking": true}'
model-loader-extra-config:
  engram_path: /home/ymzx/models/ds41-1017/engram
speculative-config:
  method: dspark
  model: /home/ymzx/models/ds41-1017-dspark
  quantization: fp8
  num_speculative_tokens: 5
  draft_load_config:
    load_format: safetensors
  enforce_eager: false
