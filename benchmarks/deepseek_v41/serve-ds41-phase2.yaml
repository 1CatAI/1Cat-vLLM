# DS-V4.1 Phase 2 API (2026-10-27): async, chunk 8192, KV 288 MiB, offload 0.33, session prefix cache.
# Needs run_serve2.sh envs: VLLM_V41_DOWN_ROWS=1, VLLM_V41K_LIB=v41k_g3, VLLM_V41_SESSION_PREFIX=1.
# Development launch profile. Run only after the acceptance report passes.
# The container must expose only V100 GPUs 0-3 and preserve 8 GiB host reserve.
model: /home/ymzx/ds41-models/gguf/DeepSeek-V4.1-Flash-1017-GSQ-RCO-IQ2_XXS-00001-of-00004.gguf
hf-config-path: /home/ymzx/ds41-models/base
tokenizer: /home/ymzx/ds41-models/base
tokenizer-mode: deepseek_v41
served-model-name: deepseek-v4.1-flash
host: 0.0.0.0
port: 18000
dtype: half
quantization: gguf
load-format: gguf
tensor-parallel-size: 4
max-model-len: 16384
max-num-seqs: 1
max-num-batched-tokens: 8192
kv-cache-memory-bytes: 301989888
gpu-memory-utilization: 0.96
