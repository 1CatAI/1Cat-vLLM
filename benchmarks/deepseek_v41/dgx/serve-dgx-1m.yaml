# DeepSeek-V4.1-Flash-1017 original checkpoint on one DGX-2H: TP4 x DP4, EP16
# experts, 1M context, prefix caching, tool calls. Environment (all default
# off in vLLM):
#   VLLM_V41_BATCH=1 VLLM_V41_WINDOW_RING=0 VLLM_V41_ASYNC=1
#   VLLM_V41_PACKED_KV_PAGES=1 VLLM_V41_SWA_FP8=1   (official DeepInfer KV)
#   VLLM_V41_INDEX_SHARD=1 VLLM_V41_LIVE_TABLE=1     (long context)
#   VLLM_V41_SESSION_PREFIX=1 VLLM_DP_PREFIX_AFFINITY=1  (prefix caching)
#   VLLM_V41_TM_CODES=1 VLLM_V41_COMBINE_TP=1 VLLM_V41_COMBINE_SPARSE=1
#   VLLM_V41_PROPOSE_GRAPH=1 VLLM_V41_BATCH_GREEDY_VERIFY=1 VLLM_V41_Q8_ROWS_MAX=96
#   VLLM_V41_DENSE_TM_ROWS=0 VLLM_V41_DENSE_SINGLE=1 (one dense copy)
#   VLLM_V41_PREFILL_DEC_ATTN=1 VLLM_V41_HC_PARTS_CUDA=1
#   VLLM_V41_EXPERT_REPLICAS=/data/ds41/tools/replicas_all.json
# KV: 2.5 GiB per GPU, about 1.35M tokens per DP group (3.5 GiB OOMed).
model: /data/ds41/model
tokenizer: /data/ds41/model
tokenizer-mode: deepseek_v41
served-model-name: deepseek-v4.1-flash
host: 0.0.0.0
port: 18000
dtype: half
tensor-parallel-size: 4
data-parallel-size: 4
enable-expert-parallel: true
all2all-backend: allgather_reducescatter
# Read only this rank's experts (follows each model's expert maps).
enable-ep-weight-filter: true
# Memory-mapped loading: the auto direct I/O path stages each shard in private
# host buffers per rank, which 16 ranks at once push past host RAM.
safetensors-load-strategy: lazy
distributed-executor-backend: mp
# One API process (the DP default starts four, ~30 s of startup).
api-server-count: 1
max-model-len: 1048576
max-num-seqs: 32
max-num-batched-tokens: 2048
kv-cache-memory-bytes: 2684354560
gpu-memory-utilization: 0.94
compilation-config:
  mode: 0
  cudagraph_mode: FULL_DECODE_ONLY
  cudagraph_capture_sizes: [6, 12, 18, 24, 30, 36, 42, 48, 60, 72, 84, 96, 120, 144, 168, 192]
  max_cudagraph_capture_size: 192
# Prefix caching (VLLM_V41_SESSION_PREFIX=1; per-slot state restore in batch
# mode; VLLM_DP_PREFIX_AFFINITY=1 keeps a session on one DP engine).
enable-prefix-caching: true
enable-chunked-prefill: true
no-disable-custom-all-reduce: true
reasoning-parser: deepseek_v4
# OpenAI tool calls from V4.1's DSML blocks.
enable-auto-tool-choice: true
tool-call-parser: deepseek_v41
default-chat-template-kwargs: '{"thinking": true}'
model-loader-extra-config:
  engram_path: /data/ds41/engram
speculative-config:
  method: dspark
  model: /data/ds41/dspark
  quantization: fp8
  num_speculative_tokens: 5
  draft_load_config:
    load_format: safetensors
  enforce_eager: false
